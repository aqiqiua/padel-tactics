<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Padel Tactics</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Aurora-фон -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="app">
    <!-- Верхняя панель -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.2 2.2c-4.2 0-7.7 3.3-7.7 7.4 0 3 1.9 5.6 4.6 6.7l-2 4.1a1.5 1.5 0 0 0 2.7 1.3l2.1-4.3c4.3-.2 7.7-3.4 7.7-7.5 0-4.1-3.4-7.4-7.5-7.4z" fill="#06281f"/>
            <circle cx="12.6" cy="7.4" r="1.15" fill="#1fd0aa"/>
            <circle cx="16.4" cy="8.1" r="1.15" fill="#1fd0aa"/>
            <circle cx="14.4" cy="11.1" r="1.15" fill="#1fd0aa"/>
            <circle cx="4.4" cy="18.3" r="2.5" fill="#06281f"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-eyebrow">PADEL</div>
          <div class="brand-title">Tactics</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-undo" title="Отменить" aria-label="Отменить">
          <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
        </button>
        <button class="icon-btn" id="btn-clear" title="Очистить рисунок" aria-label="Очистить">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
        </button>
        <button class="icon-btn" id="btn-reset" title="Сбросить позиции" aria-label="Сброс">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        </button>
        <button class="icon-btn accent" id="btn-share" title="Поделиться / сохранить" aria-label="Поделиться">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M6 12v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Корт -->
    <main class="court-area" id="court-area">
      <canvas id="board"></canvas>
    </main>

    <!-- Нижняя панель инструментов -->
    <footer class="toolbar">
      <div class="tools" id="tools">
        <button class="tool" data-tool="move" title="Перемещать">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3 3 3M12 22l-3-3m3 3 3-3M2 12l3-3m-3 3 3 3M22 12l-3-3m3 3-3 3"/></svg>
          <span>Двигать</span>
        </button>
        <button class="tool" data-tool="pen" title="Рисовать от руки">
          <svg viewBox="0 0 24 24"><path d="M3 21l3.5-1L20 6.5a2.1 2.1 0 0 0-3-3L3.5 17 3 21z"/></svg>
          <span>Кисть</span>
        </button>
        <button class="tool" data-tool="arrow" title="Стрелка">
          <svg viewBox="0 0 24 24"><path d="M4 20 20 4M20 4h-7M20 4v7"/></svg>
          <span>Стрелка</span>
        </button>
        <button class="tool" data-tool="line" title="Линия">
          <svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg>
          <span>Линия</span>
        </button>
        <button class="tool" data-tool="eraser" title="Ластик — коснитесь линии">
          <svg viewBox="0 0 24 24"><path d="M16 3 3 16a2 2 0 0 0 0 3l2 2h7l9-9a2 2 0 0 0 0-3l-5-6a2 2 0 0 0-3 0zM8 21l-5-5"/></svg>
          <span>Ластик</span>
        </button>
      </div>

      <div class="row">
        <div class="row-label">ЦВЕТ</div>
        <div class="palette" id="palette"></div>
        <div class="widths" id="widths">
          <button class="width" data-width="thin" title="Тонкая"><span class="wdot" style="width:4px;height:4px"></span></button>
          <button class="width" data-width="med" title="Средняя"><span class="wdot" style="width:7px;height:7px"></span></button>
          <button class="width" data-width="thick" title="Толстая"><span class="wdot" style="width:11px;height:11px"></span></button>
        </div>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
