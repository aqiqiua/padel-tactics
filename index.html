<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Padel Tactics</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=26" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.2 2.2c-4.2 0-7.7 3.3-7.7 7.4 0 3 1.9 5.6 4.6 6.7l-2 4.1a1.5 1.5 0 0 0 2.7 1.3l2.1-4.3c4.3-.2 7.7-3.4 7.7-7.5 0-4.1-3.4-7.4-7.5-7.4z" fill="#06281f"/>
            <circle cx="12.6" cy="7.4" r="1.15" fill="#1fd0aa"/>
            <circle cx="16.4" cy="8.1" r="1.15" fill="#1fd0aa"/>
            <circle cx="14.4" cy="11.1" r="1.15" fill="#1fd0aa"/>
            <circle cx="4.4" cy="18.3" r="2.5" fill="#06281f"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-eyebrow">PADEL</div>
          <div class="brand-title">Tactics</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-undo" title="Отменить (Cmd+Z)" aria-label="Отменить">
          <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
        </button>
        <button class="icon-btn" id="btn-reset" title="Очистить кадр" aria-label="Очистить кадр">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6"/></svg>
        </button>
        <button class="icon-btn" id="btn-templates" title="Шаблоны схем" aria-label="Шаблоны">
          <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5L12 3zM3 12.5 12 17l9-4.5M3 16.5 12 21l9-4.5"/></svg>
        </button>
        <button class="icon-btn accent" id="btn-share" title="Поделиться / сохранить" aria-label="Поделиться">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M6 12v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6"/></svg>
        </button>
      </div>
    </header>

    <main class="court-area" id="court-area">
      <canvas id="board"></canvas>
      <button class="zoom-reset" id="zoom-reset" title="Сбросить масштаб" aria-label="Сбросить масштаб">
        <svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4"/></svg>
        <span>1:1</span>
      </button>
    </main>

    <div class="framebar">
      <div class="fr-wrap">
        <button class="fr-btn" id="fr-prev" title="Предыдущий кадр" aria-label="Предыдущий">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="fr-count">Кадр <b id="fr-cur">1</b> / <span id="fr-total">1</span></div>
        <button class="fr-btn" id="fr-next" title="Следующий кадр" aria-label="Следующий">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="fr-sep"></div>
        <button class="fr-btn fr-add" id="fr-add" title="Новый пустой кадр" aria-label="Новый кадр">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="fr-btn" id="fr-dup" title="Копия текущего кадра" aria-label="Копия кадра">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <button class="fr-btn" id="fr-del" title="Удалить кадр" aria-label="Удалить кадр">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
        </button>
      </div>
    </div>

    <footer class="toolbar">
      <div class="tools" id="tools">
        <button class="tool" data-tool="move" title="Перемещать">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3 3 3M12 22l-3-3m3 3 3-3M2 12l3-3m-3 3 3 3M22 12l-3-3m3 3-3 3"/></svg>
          <span>Двигать</span>
        </button>
        <button class="tool" data-tool="pen" title="Рисовать от руки">
          <svg viewBox="0 0 24 24"><path d="M3 21l3.5-1L20 6.5a2.1 2.1 0 0 0-3-3L3.5 17 3 21z"/></svg>
          <span>Кисть</span>
        </button>
        <button class="tool" data-tool="arrow" title="Стрелка (прямая, гнётся средней точкой)">
          <svg viewBox="0 0 24 24"><path d="M4 20 20 4M20 4h-7M20 4v7"/></svg>
          <span>Стрелка</span>
        </button>
        <button class="tool" data-tool="lob" title="Свеча (высокий удар дугой)">
          <svg viewBox="0 0 24 24"><path d="M3 19q9-16 18 0"/><path d="M21 19l-5-1M21 19l-1-5"/></svg>
          <span>Свеча</span>
        </button>
        <button class="tool" data-tool="zone" title="Зона — область">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" stroke-dasharray="3.5 3"/></svg>
          <span>Зона</span>
        </button>
        <button class="tool" data-tool="text" title="Текст — заметка">
          <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>
          <span>Текст</span>
        </button>
      </div>

      <div class="row">
        <div class="row-label">ЦВЕТ</div>
        <div class="palette" id="palette"></div>
      </div>

      <div class="row">
        <div class="styles" id="styles">
          <button class="style" data-dash="solid" title="Сплошная">
            <svg viewBox="0 0 40 24"><path d="M4 12h32"/></svg>
          </button>
          <button class="style" data-dash="dashed" title="Пунктир">
            <svg viewBox="0 0 40 24"><path d="M4 12h32" stroke-dasharray="7 5"/></svg>
          </button>
          <button class="style" data-dash="dotted" title="Точки">
            <svg viewBox="0 0 40 24"><path d="M4 12h32" stroke-dasharray="1 6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="widths" id="widths">
          <button class="width" data-width="thin" title="Тонкая"><span class="wdot" style="width:3px;height:3px"></span></button>
          <button class="width" data-width="med" title="Средняя"><span class="wdot" style="width:6px;height:6px"></span></button>
          <button class="width" data-width="thick" title="Толстая"><span class="wdot" style="width:9px;height:9px"></span></button>
        </div>
        <div class="zone-alpha" id="zone-alpha" hidden>
          <span class="row-label">ФОН</span>
          <input type="range" id="alpha-range" min="0" max="60" value="15" step="1" />
        </div>
        <div class="text-size" id="text-size" hidden>
          <span class="row-label">РАЗМЕР</span>
          <button class="tsize" data-size="0.035" title="Мелкий"><span style="font-size:11px">А</span></button>
          <button class="tsize" data-size="0.05" title="Средний"><span style="font-size:15px">А</span></button>
          <button class="tsize" data-size="0.07" title="Крупный"><span style="font-size:19px">А</span></button>
          <button class="tsize" data-size="0.095" title="Большой"><span style="font-size:24px">А</span></button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Панель шаблонов -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Шаблоны схем">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <span class="sheet-title">Шаблоны схем</span>
      <button class="icon-btn" id="sheet-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-save">
      <input id="tpl-name" type="text" maxlength="40" placeholder="Название схемы" autocomplete="off" />
      <button id="tpl-update" hidden>Обновить</button>
      <button id="tpl-save">Сохранить</button>
    </div>
    <button id="tpl-publish" class="tpl-publish" hidden>Опубликовать в общие (видно всем)</button>
    <button id="tpl-merge" class="tpl-merge">Объединить схемы в раскадровку</button>
    <div id="merge-bar" class="merge-bar" hidden>
      <span id="merge-count">Тапай схемы по порядку</span>
      <div class="merge-actions">
        <button id="merge-cancel" class="merge-cancel">Отмена</button>
        <button id="merge-build" class="merge-build" disabled>Собрать</button>
      </div>
    </div>
    <div class="sheet-list" id="tpl-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js?v=26"></script>
</body>
</html>
